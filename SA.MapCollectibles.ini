[Settings]
; Collectible finder. Marks the collectibles you have NOT picked up yet, on
; both the pause map (faded, so they read as "still out there") and the
; in-game radar. The type shown is whichever one the Collectibles option on
; the pause map is set to; that option keeps showing the ones you already have
; at full brightness.
; 0 = off, 1 = on
Finder = 1

; How far away a collectible can be and still appear on the radar, in game
; units. Anything further is left off rather than being pinned to the edge of
; the radar. The pause map always shows all of them.
FinderRadarRange = 250

; How faded the not-yet-collected markers are on the pause map (0-255).
MapFadeAlpha = 120

; Collectible icon size, in thousandths of the screen width.
IconSize = 8

; Reveal armor, weapon and bribe pickups on the pause map. Adds a second row
; to the Options panel; leave at 0 to keep the menu exactly as it is. Read once
; at startup, so a restart is needed to add or remove the row.
; 0 = off (default), 1 = on
Pickups = 0

; Write every armor/weapon/bribe pickup found, and why it was or was not
; shown, to SA.MapCollectibles.log next to the .asi. Diagnostics only.
DebugLog = 0

; Icon size for the revealed pickups, in thousandths of the screen width.
PickupIconSize = 8

; Reveal asset / revenue pickups on the map and radar. These only exist once
; you actually own the property, so nothing shows for assets you have not
; unlocked. Adds a row above Collectibles; read once at startup.
; 0 = off (default), 1 = on
Assets = 0

; Asset icon size, in thousandths of the screen width.
AssetIconSize = 8

[SaveState]
; Written by the mod. Remembers the last selection you made on the pause map
; so it survives a restart. Safe to delete; it will be recreated.
Collectibles = 0
Pickups = 0
Assets = 0
