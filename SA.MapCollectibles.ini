[Settings]
; 1 = Muestra el recuadro negro oficial de GTA SA con su sonido original al entrar a la zona
EnableHelpMessage = 1

; 1 = Muestra la zona de busqueda amarilla difusa estilo RDR2 en el radar
EnableSearchZones = 1

; 0 = Oculta los iconos exactos para que busques de verdad
; 1 = Muestra los iconos de Flentric como Plan B por si te perdes
ShowExactIcons = 1

; Tamano de la zona de busqueda en metros (55m = 1 cuadra aprox)
SearchZoneRadius = 55

; Distancia a la que salta el aviso de la cajita negra (en metros)
NotificationDistance = 60
