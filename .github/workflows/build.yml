name: Build ASI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone Plugin-SDK
        run: |
          git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git D:\plugin-sdk

      - name: Build Plugin-SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "=== Archivos en Plugin-SDK ==="
          Get-ChildItem "D:\plugin-sdk" | Select-Object Name

          # 1. Si usa CMake
          if (Test-Path "D:\plugin-sdk\CMakeLists.txt") {
            Write-Host "Detectado CMake, configurando y compilando..."
            cmake -S "D:\plugin-sdk" -B "D:\plugin-sdk\build" -A Win32
            cmake --build "D:\plugin-sdk\build" --config Release
          }

          # 2. Si tiene solucion de Visual Studio (.sln)
          $sln = Get-ChildItem -Path "D:\plugin-sdk" -Filter "*.sln" -Recurse | Select-Object -First 1
          if ($sln) {
            Write-Host "Compilando solucion: $($sln.FullName)"
            msbuild $sln.FullName /p:Configuration="Release" /p:Platform="Win32" /m
          }

          # 3. Si tiene proyecto .vcxproj de San Andreas
          $proj = Get-ChildItem -Path "D:\plugin-sdk" -Filter "*sa*.vcxproj" -Recurse | Select-Object -First 1
          if ($proj) {
            Write-Host "Compilando proyecto: $($proj.FullName)"
            msbuild $proj.FullName /p:Configuration="Release" /p:Platform="Win32" /m
          }

          # 4. Copiar todas las librerias .lib encontradas a output/lib
          New-Item -ItemType Directory -Force -Path "D:\plugin-sdk\output\lib"
          $libs = Get-ChildItem -Path "D:\plugin-sdk" -Filter "*.lib" -Recurse
          foreach ($lib in $libs) {
            Write-Host "Libreria encontrada: $($lib.FullName)"
            Copy-Item $lib.FullName "D:\plugin-sdk\output\lib\" -Force
            if ($lib.Name -like "*sa*.lib") {
              Copy-Item $lib.FullName "D:\plugin-sdk\output\lib\plugin.lib" -Force
            }
          }

      - name: Build Mod ASI
        env:
          PLUGIN_SDK_DIR: D:\plugin-sdk
        run: |
          msbuild SA.MapCollectibles.vcxproj /p:Configuration="Release GTA-SA" /p:Platform="Win32" /p:PlatformToolset=v143

      - name: Upload ASI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SA.MapCollectibles-Proximity
          path: bin/**/*.asi
