name: Build ASI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone Plugin-SDK
        run: |
          git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git D:\plugin-sdk

      - name: Build Plugin-SDK (GTA SA)
        shell: cmd
        run: |
          cd /d D:\plugin-sdk
          set PLUGIN_SDK_DIR=D:\plugin-sdk
          call "tools\generate\Visual Studio.bat"
          msbuild plugin.slnx /property:Configuration=Release /property:Platform="Mixed Platforms" /target:plugin_sa /m || msbuild plugin.slnx /property:Configuration=zRelease /property:Platform="Mixed Platforms" /target:plugin_sa /m || msbuild plugin.slnx /property:Configuration=zDebug /property:Platform="Mixed Platforms" /target:plugin_sa /m

      - name: Ensure plugin.lib exists
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "D:\plugin-sdk\output\lib"
          $libs = Get-ChildItem -Path "D:\plugin-sdk" -Filter "*.lib" -Recurse
          foreach ($lib in $libs) {
            Write-Host "Libreria encontrada: $($lib.FullName)"
            if ($lib.DirectoryName -ne "D:\plugin-sdk\output\lib") {
              Copy-Item $lib.FullName "D:\plugin-sdk\output\lib\" -Force
            }
            if ($lib.Name -like "*sa*.lib") {
              Copy-Item $lib.FullName "D:\plugin-sdk\output\lib\plugin.lib" -Force
            }
          }
          if (Test-Path "D:\plugin-sdk\output\lib\plugin_sa.lib") {
            Copy-Item "D:\plugin-sdk\output\lib\plugin_sa.lib" "D:\plugin-sdk\output\lib\plugin.lib" -Force
          }

      - name: Build Mod ASI
        env:
          PLUGIN_SDK_DIR: D:\plugin-sdk
        run: |
          msbuild SA.MapCollectibles.vcxproj /p:Configuration="Release GTA-SA" /p:Platform="Win32"

      - name: Upload ASI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SA.MapCollectibles-Proximity
          path: bin/**/*.asi
