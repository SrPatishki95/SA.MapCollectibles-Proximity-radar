name: Build ASI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone Plugin-SDK
        run: |
          git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git D:\plugin-sdk

      - name: Build Plugin-SDK
        shell: powershell
        run: |
          # Descargar premake5 para generar los proyectos de Visual Studio
          Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-windows.zip" -OutFile "D:\plugin-sdk\premake5.zip"
          Expand-Archive -Path "D:\plugin-sdk\premake5.zip" -DestinationPath "D:\plugin-sdk"
          Set-Location "D:\plugin-sdk"
          .\premake5.exe vs2022

          # Compilar Plugin-SDK
          $sln = Get-ChildItem -Path "D:\plugin-sdk" -Filter "*.sln" -Recurse | Select-Object -First 1
          if ($sln) {
            Write-Host "Compilando: $($sln.FullName)"
            msbuild $sln.FullName /p:Configuration="Release" /p:Platform="Win32" /m
          }

          # Asegurar que la carpeta de librerias exista y tenga plugin.lib
          New-Item -ItemType Directory -Force -Path "D:\plugin-sdk\output\lib"
          $libs = Get-ChildItem -Path "D:\plugin-sdk" -Filter "*.lib" -Recurse
          foreach ($lib in $libs) {
            Copy-Item $lib.FullName "D:\plugin-sdk\output\lib\" -Force
            if ($lib.Name -like "*sa*.lib") {
              Copy-Item $lib.FullName "D:\plugin-sdk\output\lib\plugin.lib" -Force
            }
          }

      - name: Build Mod ASI
        env:
          PLUGIN_SDK_DIR: D:\plugin-sdk
        run: |
          msbuild SA.MapCollectibles.vcxproj /p:Configuration="Release GTA-SA" /p:Platform="Win32" /p:PlatformToolset=v143

      - name: Upload ASI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SA.MapCollectibles-Proximity
          path: bin/**/*.asi
